[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "work-history"
version = "0.1.0"
description = "Personal Jira, Confluence, GitLab, and Slack work-history collector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.35,<2",
  "cryptography>=43",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "slack-sdk>=3.35,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
mcp = [
  "mcp>=2.2,<3",
]
dev = [
  "httpx2>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
work-history = "work_history.cli:main"
work-history-agent = "work_history.gitlab_agent:main"
work-history-mcp = "work_history.mcp_server:main"
work-history-report-agent = "work_history.report_agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/work_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/work_history/api.py" = ["B008"]
